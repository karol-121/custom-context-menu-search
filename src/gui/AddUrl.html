<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="css/acorn-alike.css">
	<link rel="stylesheet" type="text/css" href="css/acorn-alike-color.css">
	<title>Add new url</title>
</head>
<body>

	<div class="flex-element">
		<div>
			<button id="cancel-button" class="btn btn-hover btn-secondary" title="Go back">
				<svg class="icon icon-color"><use href="../icons/feather-icons.svg#chevron-left" /></svg>
			</button>
			<h3 class="inline-element">Add new url</h3>
		</div>
	</div>

	<hr>
	
	<div id="admonition" class="admonition-hidden">
		<div id="admonition-content">
			<b><span id="admonition-title"></span></b>
			<span id="admonition-text"></span>
		</div>
	</div>

	<div class="width-60">
		<label class="block-element" for="url">Url:</label>
		<input class="input-text width-100" id="url-field" type="text" name="url" placeholder="www.example.com/?q=%s" pattern="\S{3,200}">
		<span class="txt-secondary block-element">Use "%s" as a wildcard for search value in links.</span>
		<button id="submit-button" class="btn btn-hover btn-primary">Add</button>
	</div>

	<script src="../utils/random-id.js"></script>
	<script src="../objects/ItemManager.js"></script>
	<script src="lib/localization.js"></script>
	<script src="lib/admonitions.js"></script>
	<script src="js/addUrl.js"></script>

</body>
</html>
