<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="css/acorn-alike.css">
	<link rel="stylesheet" type="text/css" href="css/acorn-alike-color.css">
	<title>Delete context menu search item</title>
</head>
<body>

	<div class="flex-element">
		<div>
			<button id="cancel-button" class="btn btn-hover btn-secondary" title="Go back">
				<svg class="icon icon-color"><use href="../icons/feather-icons.svg#chevron-left" /></svg>
			</button>
			<h3 class="inline-element">Edit context menu search item</h3>
		</div>
		<button id="delete-button" class="btn btn-hover btn-secondary" title="Delete">
			<svg class="icon icon-color"><use href="../icons/feather-icons.svg#trash" /></svg>
		</button>
	</div>

	<hr>

	<div id="admonition" class="admonition-hidden">
		<div id="admonition-content">
			<b><span id="admonition-title"></span></b>
			<span id="admonition-text"></span>
		</div>
	</div>

	<div>
		
	</div>

	<script src="lib/localization.js"></script>
	<script src="lib/admonitions.js"></script>
	<script src="js/delete.js"></script>
</body>
</html>
