<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="css/acorn-alike.css">
	<link rel="stylesheet" type="text/css" href="css/acorn-alike-color.css">
	<title>Edit context menu search item</title>
</head>
<body>

	<div class="flex-element">
		<div>
			<button id="cancel-button" class="btn btn-hover btn-secondary" title="Go back">
				<svg class="icon icon-color"><use href="../icons/feather-icons.svg#chevron-left" /></svg>
			</button>
			<h3 class="inline-element">Edit context menu search item</h3>
		</div>
		<button id="delete-button" class="btn btn-hover btn-secondary" title="Delete">
			<svg class="icon icon-color"><use href="../icons/feather-icons.svg#trash" /></svg>
		</button>
	</div>

	<hr>
	
	<div id="admonition" class="admonition-hidden">
		<div id="admonition-content">
			<b><span id="admonition-title"></span></b>
			<span id="admonition-text"></span>
		</div>
	</div>

	<div class="width-60">
		<label class="block-element" for="title">Name:</label>
		<input class="input-text width-100" id="title-field" type="text" name="title" placeholder="Example" pattern=".{1,30}">
		<div id="handling-fieldset">
			<label for="handling" class="block-element">Action:</label>
			<select id="handling-select" class="input-text width-100" name="handling">
				<option value="2">Open all (excluding groups)</option>
				<option value="3">Open all (including groups)</option>
				<option value="1">Open options page</option>
			</select>
		</div>
		<div id="url-fieldset">
			<label class="block-element" for="url">Url:</label>
			<input class="input-text width-100" id="url-field" type="text" name="url" placeholder="www.example.com/?q=%s" pattern="\S{3,200}">
			<span class="txt-secondary block-element">Use "%s" as a wildcard for search value in links.</span>
		</div>
		<button id="submit-button" class="btn btn-hover btn-primary">Edit</button>
	</div>

	<script src="../objects/ItemManager.js"></script>
	<script src="lib/localization.js"></script>
	<script src="lib/admonitions.js"></script>
	<script src="js/edit.js"></script>
</body>
</html>
